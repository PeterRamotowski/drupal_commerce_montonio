commerce_montonio.webhook:
  path: '/payment/notify/{commerce_payment_gateway}'
  defaults:
    _controller: '\Drupal\commerce_montonio\Controller\MontonioWebhookController::handle'
  requirements:
    # Webhook endpoint must be publicly accessible for external payment provider notifications.
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: 'TRUE'
